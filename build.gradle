plugins {
    id 'java'
}

group = 'com.portfolio'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    agent
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.25.0'
    testImplementation 'org.testng:testng:7.10.2'
    implementation 'io.rest-assured:rest-assured:5.5.0'
    testImplementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'io.qameta.allure:allure-java-commons:2.29.0'
    implementation 'io.qameta.allure:allure-rest-assured:2.29.0'
    testImplementation 'io.qameta.allure:allure-testng:2.29.0'
    implementation 'com.h2database:h2:2.3.232'
    agent 'org.aspectj:aspectjweaver:1.9.22.1'
}

test {
    // ./gradlew test -Psuite=smoke   (default: regression)
    def suiteName = project.findProperty('suite') ?: 'regression'

    useTestNG {
        listeners = ['com.portfolio.listeners.TestListener']
        suites file("src/test/resources/suites/${suiteName}.xml")
    }


    jvmArgs "-javaagent:${configurations.agent.singleFile}"
    systemProperty 'allure.results.directory', "$buildDir/allure-results"

    ['browser', 'headless', 'execution', 'env', 'api.base.url', 'ui.base.url'].each { key ->
        if (System.getProperty(key)) {
            systemProperty key, System.getProperty(key)
        }
    }

    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
    }
}
tasks.register('qualityGate', JavaExec) {
    group = 'verification'
    description = 'Fails if the pass rate stored in the results DB is below the threshold'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.portfolio.db.QualityGate'
}
//to execute quality gate use command : ./gradlew clean test qualityGate --continue